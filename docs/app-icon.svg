<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"    stop-color="#1b1d23"/>
      <stop offset="0.42" stop-color="#0d0e12"/>
      <stop offset="1"    stop-color="#050506"/>
    </linearGradient>

    <!-- The pet's own light: the only light source in the mark, and the thing
         that lets a black shelf read against a near-black tile. -->
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#a8d0ff" stop-opacity="0.60"/>
      <stop offset="0.40" stop-color="#6aa6f0" stop-opacity="0.20"/>
      <stop offset="1"    stop-color="#6aa6f0" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="face" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.6" stop-color="#e8f1fb"/>
      <stop offset="1"   stop-color="#bdd3ea"/>
    </linearGradient>

    <!-- Rim light along the underside of the shelf, brightest directly above
         the pet. Physically motivated: the shelf is lit by the thing under it. -->
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"    stop-color="#8fc4ff" stop-opacity="0.05"/>
      <stop offset="0.5"  stop-color="#cfe6ff" stop-opacity="0.42"/>
      <stop offset="1"    stop-color="#8fc4ff" stop-opacity="0.05"/>
    </linearGradient>

    <clipPath id="bodyClip">
      <rect x="92" y="92" width="840" height="840" rx="196" ry="196"/>
    </clipPath>
  </defs>

  <rect x="92" y="92" width="840" height="840" rx="196" ry="196" fill="url(#body)"/>

  <g clip-path="url(#bodyClip)">
    <!-- Bloom sits behind everything, so it lifts the shelf's underside too. -->
    <circle cx="512" cy="540" r="330" fill="url(#bloom)"/>

    <!-- The pet, drawn first so the shelf can occlude the top of its head:
         it is looking out from under the notch, not sitting beside it. -->
    <circle cx="512" cy="520" r="188" fill="url(#face)"/>
    <rect x="449" y="452" width="48" height="126" rx="24" fill="#0a0a0d"/>
    <rect x="527" y="452" width="48" height="126" rx="24" fill="#0a0a0d"/>

    <!-- The shelf: flush and square where it meets the top edge, rounded where
         it hangs. Wide and shallow, so it reads as a notch rather than a box. -->
    <path d="M 196 92 L 828 92 L 828 268 Q 828 356 740 356 L 284 356 Q 196 356 196 268 Z"
          fill="#000000"/>
    <path d="M 196 268 Q 196 356 284 356 L 740 356 Q 828 356 828 268"
          fill="none" stroke="url(#rim)" stroke-width="4"/>

    <!-- The roster: the other agents, each in its own status colour. -->
    <circle cx="430" cy="790" r="26" fill="#2FD6A8"/>
    <circle cx="512" cy="790" r="26" fill="#FFB224"/>
    <circle cx="594" cy="790" r="26" fill="#9B6BFF"/>
  </g>

  <rect x="92" y="92" width="840" height="840" rx="196" ry="196"
        fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
